{% extends "base.html" %}

{% block title %}{{ 'Edit' if category else 'New' }} Category - {{ app_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-tags"></i> {{ 'Edit' if category else 'New' }} Category</h2>
            <a href="{{ url_for('organization.categories') }}" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>

        <div class="card shadow-blue">
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                    <div class="mb-3">
                        <label for="name" class="form-label">Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" name="name"
                               value="{{ category.name if category else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="category_type" class="form-label">Type <span class="text-danger">*</span></label>
                        <select class="form-select" id="category_type" name="category_type" required>
                            <option value="material" {{ 'selected' if category and category.category_type == 'material' else '' }}>Material</option>
                            <option value="item" {{ 'selected' if category and category.category_type == 'item' else '' }}>Item (Finished Good)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3">{{ category.description if category else '' }}</textarea>
                    </div>

                    {% if category %}
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="active" name="active" {{ 'checked' if category.active else '' }}>
                        <label class="form-check-label" for="active">Active</label>
                    </div>
                    {% endif %}

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('organization.categories') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Save
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
